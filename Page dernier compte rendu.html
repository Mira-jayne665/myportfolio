<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compte Rendu | Mirabelle PEDANOU</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .navbar {
            background-color: var(--primary-color);
            padding: 15px 0;
        }
        
        .page-header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            padding: 120px 0 60px;
            margin-bottom: 50px;
        }
        
        .internal-page {
            padding-top: 80px;
            min-height: 100vh;
        }
        
        .back-button {
            margin-bottom: 30px;
        }
        
        footer {
            background-color: var(--primary-color);
            color: white;
            padding: 40px 0 20px;
            margin-top: 50px;
        }
        
        .content-placeholder {
            background-color: #f8f9fa;
            border: 2px dashed #dee2e6;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">Mirabelle PEDANOU</a>
        </div>
    </nav>

    <!-- Page Header -->
    <div class="page-header">
        <div class="container">
            <h1 class="display-4 fw-bold" id="report-title">Compte Rendu</h1>
        </div>
    </div>

    <!-- Main Content -->
    <div class="internal-page">
        <div class="container">
            <div class="back-button">
                <a href="comptes-rendus.html" class="btn btn-outline-primary">
                    <i class="bi bi-arrow-left"></i> Retour aux comptes rendus
                </a>
            </div>

            <div class="content-placeholder">
                <i class="bi bi-file-text display-4 text-muted"></i>
                <h3 class="mt-3" id="placeholder-title">Chargement du compte rendu...</h3>
                <p class="text-muted">Le contenu du compte rendu s'affichera ici</p>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center">
        <div class="container">
            <p>© 2023 Houéfa Pierrette Mirabelle PEDANOU</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Récupération de l'ID depuis l'URL
        function getReportId() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('id') || '1';
        }

        // Noms des comptes rendus
        const reportNames = {
            1: "Compte rendu Portfolio",
            2: "Compte rendu Jeu", 
            3: "Compte rendu Paramétrage",
            4: "Compte rendu HTML",
            5: "Compte rendu Logiciel capture d'écran",
            6: "Compte rendu Java"
        };

        // Chargement du compte rendu
        function loadReport() {
            const reportId = getReportId();
            const reportName = reportNames[reportId];
            
            if (reportName) {
                document.getElementById('report-title').textContent = reportName;
                document.getElementById('placeholder-title').textContent = reportName;
                document.title = `${reportName} | Mirabelle PEDANOU`;
            }
        }

        // Chargement initial
        window.addEventListener('DOMContentLoaded', loadReport);
    </script>
</body>
</html>
